<title>Power BI Quest · Opération Wonderland</title>
<meta name="description" content="Power BI Quest : 60 jours pour sauver un parc d'attractions grâce à la data. Apprends Power BI en immersion, mission après mission.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141B3C'/%3E%3Cpath d='M9 23v-6M14 23v-10M19 23v-14M24 23v-8' stroke='%23F2C811' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

<body>
<div class="stage">
 <div class="phone-wrap" id="wrap">
  <div class="phone" id="phone">
   <div class="screen" id="screen">

    <div class="statusbar" aria-hidden="true">
      <span id="sb-time">9:41</span>
      <span class="island"></span>
      <span class="sb-r">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x=".6" y=".6" width="21.8" height="11.8" rx="3.6" stroke="currentColor" stroke-opacity=".45" stroke-width="1.2"/><rect x="2.2" y="2.2" width="18.6" height="8.6" rx="2.2" fill="currentColor"/><path d="M24 4.5c.8.3 1.3 1 1.3 2s-.5 1.7-1.3 2z" fill="currentColor" fill-opacity=".5"/></svg>
      </span>
    </div>

    <!-- Parc -->
    <section class="view tabview is-on" id="v-parc">
      <header class="park-head">
        <div class="brand">
          <div class="wordmark">Power BI Quest<small>Opération Wonderland</small></div>
          <div class="xp-pill"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M9.2 1L3 9h4.2L6.6 15 13 7H8.8z"/></svg><span id="xp-home">0 XP</span></div>
        </div>
      </header>
      <div class="scroll" id="park-scroll">
        <div id="maps"></div>
        <p class="park-foot" id="park-foot"></p>
      </div>
    </section>

    <!-- Bureau -->
    <section class="view tabview" id="v-bureau" inert>
      <div class="scroll" id="bureau-scroll"></div>
    </section>

    <!-- Mémo -->
    <section class="view tabview" id="v-memo" inert>
      <div class="scroll" id="memo-scroll"></div>
    </section>

    <nav class="tabbar" id="tabbar" aria-label="Navigation">
      <div class="tabs">
        <button class="tab is-on" data-tab="parc" aria-current="page"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M2.5 5.5l5-2 5 2 5-2v11l-5 2-5-2-5 2z"/><path d="M7.5 3.5v11M12.5 5.5v11"/></svg>Parc</button>
        <button class="tab" data-tab="bureau"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4" width="14" height="9" rx="1.5"/><path d="M7.5 16.5h5M10 13v3.5"/></svg>Bureau</button>
        <button class="tab" data-tab="memo"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="12" height="14" rx="2"/><path d="M7.3 7.5h5.4M7.3 10.5h5.4M7.3 13.5h3" stroke-linecap="round"/></svg>Mémo</button>
      </div>
    </nav>

    <!-- Mission -->
    <section class="view mission" id="mission" aria-label="Mission" inert>
      <div class="layer cine" id="cine">
        <div class="cine-bg" id="cine-bg"></div>
        <div class="cine-top"><div class="cine-title" id="cine-title"></div><button class="cine-skip" id="cine-skip">Passer</button></div>
        <div class="cine-stack" id="cine-stack" aria-live="polite"></div>
      </div>

      <div class="layer work" id="work">
        <header class="w-top">
          <button class="w-quit" id="w-quit" aria-label="Quitter la mission"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l10 10M14 4L4 14"/></svg></button>
          <div class="w-title"><small id="w-kicker"></small><b id="w-name"></b></div>
          <button class="w-hint" id="w-hint" aria-label="Obtenir un indice"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7.4 14.5h5.2M8 17h4M10 2.8a5.2 5.2 0 00-3 9.4c.5.4.8 1 .8 1.6v.7h4.4v-.7c0-.6.3-1.2.8-1.6a5.2 5.2 0 00-3-9.4z"/></svg><span id="w-hint-n">3</span></button>
          <div class="w-xp" id="w-xp"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M9.2 1L3 9h4.2L6.6 15 13 7H8.8z"/></svg><span id="w-xp-n">0 XP</span></div>
        </header>
        <ol class="w-steps" id="w-steps" aria-hidden="true"></ol>
        <div class="ws" id="ws"></div>
        <div class="dock" id="dock">
          <button class="dock-grab" id="dock-grab" type="button" aria-label="Revoir la conversation"><i></i></button>
          <div class="thread" id="thread" aria-live="polite"></div>
          <div class="consigne" id="consigne"><div class="cs-in"><div class="cs"><svg class="cs-i" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="10" r="3" fill="currentColor"/></svg><p class="cs-t" id="consigne-t"></p></div></div></div>
          <div class="answer" id="answer"><div class="ans-in"><div class="ans-card" id="ans-card"></div></div></div>
        </div>
      </div>

      <div class="layer reward" id="reward"></div>
    </section>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog"></div>
    <div class="toast" id="toast" role="status"></div>

   </div>
  </div>
 </div>
